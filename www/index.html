<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>Family Medicine</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Roboto,sans-serif;background:#eef2f7;color:#0f172a}
#top{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 30px;border-radius:0 0 26px 26px}
#top h1{margin:0;font-size:22px}#top small{opacity:.85}
#v{padding:0 14px 96px;margin-top:-16px}
.c{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #0f172a14}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.pb{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-top:4px}.pb i{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#22c55e)}
.r{border-top:1px solid #eef2f7;padding:10px 0}.t{font-weight:700}.s{color:#64748b;font-size:13px}
.ch{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;margin-right:4px}
.g{background:#dcfce7;color:#166534}.rd{background:#fee2e2;color:#991b1b}.y{background:#fef3c7;color:#92400e}.gr{background:#e2e8f0;color:#475569}
.bt{border:0;border-radius:12px;padding:9px 12px;margin:6px 6px 0 0;font-weight:600;font-size:14px;color:#fff}
.b1{background:#16a34a}.b2{background:#2563eb}.b3{background:#ef4444}.b0{background:#475569}
input,select{width:100%;padding:11px;margin:4px 0;border:1px solid #cbd5e1;border-radius:12px;font-size:15px;background:#fff}
input[type=checkbox]{width:auto;margin-right:8px}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;box-shadow:0 -4px 16px #0f172a14;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{flex:1;border:0;background:none;padding:8px 0;font-size:11px;color:#64748b}#nav b{display:block;font-size:20px;font-weight:400}#nav .a{color:#0f766e;font-weight:700}
.ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ring span{background:#fff;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.bar{display:inline-block;width:6%;margin-right:1%;border-radius:4px 4px 0 0;background:#14b8a6}.bw{height:60px;display:flex;align-items:flex-end;margin-top:8px}
#ov{display:none;position:fixed;inset:0;background:linear-gradient(160deg,#7f1d1d,#dc2626);color:#fff;z-index:9;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px}
#ov h1{text-align:center;font-size:36px;margin:20px 0 4px}#ov p{text-align:center;margin:0 0 16px;opacity:.9}#ov .c{color:#0f172a}#ov .bt{display:block;width:100%;padding:15px;font-size:17px;margin:8px 0 0}
</style>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body>
<div id="top"><h1>Family Medicine</h1><small id="clk"></small></div><div id="v"></div><div id="nav"></div><div id="ov"></div>
<script>
const FB=window.FB||null;
const IST='Asia/Kolkata',$=id=>document.getElementById(id),cap=n=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins[n];
const dk=(d=new Date())=>d.toLocaleDateString('en-CA',{timeZone:IST});
const nowM=()=>{const p=new Date().toLocaleTimeString('en-GB',{timeZone:IST,hour12:false}).split(':');return +p[0]*60+ +p[1]};
const tm=s=>{const a=s.split(':');return +a[0]*60+ +a[1]};
const back=i=>dk(new Date(Date.now()-i*864e5));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){const t=dk();let n=1;const M=[['amar','Amar Thakar'],['lilam','Lilam Thakar'],['madhu','Madhusudan Thakar']];
 const D=[['amar','NEWTEL 40','23:00','before sleeping'],['lilam','BEPLEX CZS','10:30','after breakfast'],['lilam','ASOMEX S','13:30','before lunch'],['lilam','ISRYL-M1','14:30','after lunch'],['lilam','MBSOL-SL','21:30','after dinner'],['lilam','ROSULESS-10','21:30','after dinner'],['madhu','Amlokind AT','21:30','after dinner'],['madhu','TAMLOMIN 0.4','21:30','after dinner']];
 const meds=D.map(d=>({id:n++,m:d[0],n:d[1],t:d[2],w:d[3],from:t,on:true}));
 M.forEach(m=>meds.push({id:n++,m:m[0],n:'Vitamin D',t:'09:00',w:'every 15 days',every:15,from:t,on:true}));
 return{members:M.map(m=>({id:m[0],name:m[1]})),meds,logs:{},nid:n,ts:1}}
let S=JSON.parse(localStorage.S||'null')||seed(),P=JSON.parse(localStorage.P||'{}'),tab='today',lastDay=dk(),db,PS=null;
const pf=id=>Object.assign({notify:true,alarm:true},P[id]);
const nm=id=>(S.members.find(m=>m.id===id)||{name:'?'}).name,fn=id=>nm(id).split(' ')[0];
const COL=['#0f766e','#2563eb','#c026d3','#ea580c','#4f46e5','#0891b2'];
const av=id=>{const i=Math.max(0,S.members.findIndex(m=>m.id===id));return`<div class=av style="background:${COL[i%6]}">${esc(nm(id)[0])}</div>`};
function persist(struct){if(struct)S.ts=Date.now();localStorage.S=JSON.stringify(S);localStorage.P=JSON.stringify(P);push();render();if(struct)sched()}
function push(){if(db)db.doc('family/main').set({j:JSON.stringify(S)}).catch(()=>{})}
function merge(R){for(const d in R.logs){S.logs[d]=S.logs[d]||{};for(const k in R.logs[d]){const a=S.logs[d][k],b=R.logs[d][k];if(!a||b.t>a.t)S.logs[d][k]=b}}
 if(R.ts>S.ts){S.members=R.members;S.meds=R.meds;S.nid=Math.max(S.nid,R.nid);S.ts=R.ts;sched()}localStorage.S=JSON.stringify(S);render()}
function initSync(){if(!FB||!window.firebase)return;try{firebase.initializeApp(FB);db=firebase.firestore();
 db.doc('family/main').onSnapshot(s=>{if(s.exists&&!s.metadata.hasPendingWrites)merge(JSON.parse(s.data().j))});push()}catch(e){}}
const isDue=(m,d)=>{if(d<m.from||(m.off&&d>=m.off))return false;return m.every?Math.round((Date.parse(d)-Date.parse(m.from))/864e5)%m.every===0:true};
const dueOn=d=>S.meds.filter(m=>isDue(m,d)).sort((a,b)=>tm(a.t)-tm(b.t));
const lg=(id,d=dk())=>{const l=(S.logs[d]||{})[id];return l&&l.s==='reset'?undefined:l};
const done=l=>l&&(l.s==='taken'||l.s==='taking');
function mark(id,s,d=dk()){const m=S.meds.find(x=>x.id===id);const was=done(lg(id,d));S.logs[d]=S.logs[d]||{};S.logs[d][id]={s,t:Date.now(),hm:nowM()};
 const now=s==='taken'||s==='taking';if(m&&m.stock!=null){if(!was&&now)m.stock=Math.max(0,m.stock-1);if(was&&!now)m.stock++}
 const MA=cap('MedAlarm');if(MA)MA.stop();persist(true);popup()}
const LB={taken:'Already taken',taking:'Taking',forgot:'Forgot (counts as missed)'};
function ask(id,s){const m=S.meds.find(x=>x.id===id);if(confirm(fn(m.m)+' · '+m.n+'\n\nMark as: '+LB[s]+'?'))mark(id,s)}
function undo(id){const m=S.meds.find(x=>x.id===id);if(!confirm('Reset '+fn(m.m)+' · '+m.n+' back to pending?'))return;
 if(done(lg(id))&&m.stock!=null)m.stock++;S.logs[dk()][id]={s:'reset',t:Date.now(),hm:nowM()};persist(true);popup()}
const acts=m=>lg(m.id)?`<button class="bt b0" onclick="undo(${m.id})">Change answer</button>`:(tm(m.t)-60>nowM()?'<span class=s>Buttons unlock 1 hour before this dose</span>':btns(m));
const stat=m=>{const l=lg(m.id);if(!l)return tm(m.t)<nowM()?'<span class="ch y">Pending</span>':'<span class="ch gr">Upcoming</span>';
 return({taken:'<span class="ch g">Taken</span>',taking:'<span class="ch g">Taking</span>',forgot:'<span class="ch rd">Forgot · missed</span>'})[l.s]||''};
const stk=m=>{if(m.stock==null)return'';const d=m.every?m.stock*m.every:m.stock;return`<span class="ch ${d<=5?'rd':'gr'}">${m.stock} left${d<=5?' · refill soon':''}</span>`};
const btns=m=>`<button class="bt b1" onclick="ask(${m.id},'taken')">✔ Already taken</button><button class="bt b2" onclick="ask(${m.id},'taking')">💊 Taking</button><button class="bt b3" onclick="ask(${m.id},'forgot')">😬 Forgot</button>`;
function vToday(){const n=nowM(),d=dueOn(dk());let h='';
 if(cap('MedAlarm')&&PS&&(!PS.exact||!PS.fsi||!PS.battery))h+=`<div class=c style="background:#fef3c7"><b>Finish alarm setup</b><div class=s>Open the Alerts tab and allow the 3 permissions so the alarm can ring and take over the screen.</div></div>`;
 const od=d.filter(m=>!lg(m.id)&&tm(m.t)+45<=n);
 if(od.length)h+=`<div class=c style="background:#fee2e2"><b>Overdue by 45+ minutes</b>`+od.map(m=>`<div class=s>${esc(fn(m.m))} · ${esc(m.n)} (${m.t})</div>`).join('')+'</div>';
 const nx=d.find(m=>!lg(m.id)&&tm(m.t)>n);if(nx){const x=tm(nx.t)-n;h+=`<div class=c><span class=s>Next dose</span><div class=t>${esc(fn(nx.m))} · ${esc(nx.n)}</div><div class=s>at ${nx.t} · in ${Math.floor(x/60)}h ${x%60}m</div></div>`}
 return h+S.members.map(M=>{const L=d.filter(m=>m.m===M.id),k=L.filter(m=>done(lg(m.id))).length;
  return`<div class=c><div class=hd>${av(M.id)}<div style="flex:1"><div class=t>${esc(M.name)}</div><div class=s>${k} of ${L.length} taken today</div><div class=pb><i style="width:${L.length?k/L.length*100:0}%"></i></div></div></div>`+
  L.map(m=>`<div class=r><span class=s>${m.t}</span> <span class=t>${esc(m.n)}</span> <span class=s>${esc(m.w)}</span><br>${stat(m)}${stk(m)}<br>${acts(m)}</div>`).join('')+'</div>'}).join('')}
function rep(id){let sch=0,tk=0,ot=0,fg=0,days=[],streak=0,broke=false;
 for(let i=13;i>=0;i--){const d=back(i);let s=0,t=0;dueOn(d).filter(m=>m.m===id).forEach(m=>{if(i===0&&tm(m.t)>nowM())return;s++;const l=lg(m.id,d);if(l&&l.s==='forgot')fg++;if(done(l)){t++;if(l.hm-tm(m.t)<=60||dk(new Date(l.t))!==d)ot++}});sch+=s;tk+=t;days.push(s?t/s:null)}
 for(let i=1;i<14&&!broke;i++){const x=days[13-i];if(x===null)continue;if(x===1)streak++;else broke=true}
 return{acc:sch?Math.round(tk/sch*100):0,ot:tk?Math.round(ot/tk*100):0,streak,days,sch,tk,fg}}
function vReport(){return S.members.map(M=>{const r=rep(M.id),c=r.acc>=90?'#16a34a':r.acc>=70?'#f59e0b':'#ef4444';
 return`<div class=c><div class=hd><div class=ring style="background:conic-gradient(${c} ${r.acc*3.6}deg,#e2e8f0 0)"><span>${r.acc}%</span></div><div><div class=t>${esc(M.name)}</div><div class=s>Last 14 days · ${r.tk}/${r.sch} doses</div>${r.streak>=7?'<span class="ch g">Week streak</span>':r.streak>=3?'<span class="ch y">On a roll</span>':''}</div></div>
 <div class=s>Perfect-day streak: <b>${r.streak}</b> · On-time: <b>${r.ot}%</b> · Forgot: <b>${r.fg}</b></div>
 <div class=bw>${r.days.map(x=>`<span class=bar style="height:${x===null?3:Math.max(4,x*60)}px;${x!==null&&x<1?'background:#f59e0b':''}"></span>`).join('')}</div><div class=s>Daily completion, oldest to today</div></div>`}).join('')}
function vMeds(){return S.members.map(M=>`<div class=c><div class=hd>${av(M.id)}<div class=t>${esc(M.name)}</div></div>`+S.meds.filter(m=>m.m===M.id&&m.on&&(!m.off||m.off>dk())).map(m=>`<div class=r><span class=s>${m.t}</span> <span class=t>${esc(m.n)}</span> <span class=s>${esc(m.w)}</span><br>${stk(m)}<br><button class="bt b0" onclick="refill(${m.id})">Refill count</button><button class="bt b3" onclick="stop(${m.id})">Dismiss</button></div>`).join('')+'</div>').join('')+
 `<div class=c><div class=t>Add medicine</div><select id=am>${S.members.map(m=>`<option value=${m.id}>${esc(m.name)}</option>`).join('')}</select><input id=an placeholder="Medicine name"><input id=at type=time value="09:00"><input id=aw placeholder="When (after breakfast...)"><input id=ae type=number placeholder="Repeat every N days (blank = daily)"><input id=as type=number placeholder="Tablets in stock (optional)"><button class="bt b1" onclick=addMed()>Add medicine</button></div>
 <div class=c><div class=t>Add family member</div><input id=nn placeholder="Member name"><button class="bt b1" onclick=addMem()>Add member</button></div>`}
function stop(id){if(!confirm('Stop this medicine from today? History is kept.'))return;S.meds.find(m=>m.id===id).off=dk();persist(true)}
function refill(id){const m=S.meds.find(x=>x.id===id),v=prompt('How many tablets are in stock now?',m.stock==null?'':m.stock);if(v===null||v==='')return;m.stock=+v;persist(true)}
function addMed(){const n=$('an').value.trim();if(!n)return alert('Enter a name');S.meds.push({id:S.nid++,m:$('am').value,n,t:$('at').value||'09:00',w:$('aw').value,every:+$('ae').value||0,stock:$('as').value===''?null:+$('as').value,from:dk(),on:true});persist(true)}
function addMem(){const n=$('nn').value.trim();if(!n)return;S.members.push({id:'m'+Date.now(),name:n});persist(true)}
function vSet(){const ok=x=>x?'<span class="ch g">Allowed</span>':'<span class="ch rd">Needed</span>';const o=(l,k,f)=>`<div class=r>${l} ${PS?ok(PS[k]):''}${PS&&!PS[k]?`<br><button class="bt b2" onclick="cap('MedAlarm').${f}()">Allow</button>`:''}</div>`;
 return`<div class=c><div class=t>Alarm permissions</div><div class=s>Needed once on this phone so the alarm can ring and take over the screen.</div>${cap('MedAlarm')?o('Exact alarms','exact','openExact')+o('Full-screen alerts','fsi','openFsi')+o('Battery: unrestricted','battery','openBattery'):'<div class=s>Install the APK to use these.</div>'}<button class="bt b0" onclick="sched({id:1,at:Date.now()+10000,title:'TEST ALARM',body:'Alarm test',daily:false,strict:true})">Test alarm in 10 seconds</button></div>`+
 S.members.map(M=>{const p=pf(M.id),c=(k,l)=>`<label style="display:block;padding:6px 0"><input type=checkbox ${p[k]?'checked':''} onchange="setP('${M.id}','${k}',this.checked)">${l}</label>`;
  return`<div class=c><div class=hd>${av(M.id)}<div class=t>${esc(M.name)}</div></div>${c('notify','Remind on this phone (full-screen MEDICINE TIME)')}${c('alarm','Loud ringing alarm')}</div>`}).join('')+`<div class=c>Live sync: <b>${db?'ON':'OFF (this phone only)'}</b></div>`}
function setP(id,k,v){P[id]=Object.assign(pf(id),{[k]:v});persist(true)}
function render(){const T=[['today','🏠','Today'],['report','📊','Report'],['meds','💊','Medicines'],['set','⏰','Alerts']];
 $('nav').innerHTML=T.map(t=>`<button class="${t[0]===tab?'a':''}" onclick="tab='${t[0]}';render()"><b>${t[1]}</b>${t[2]}</button>`).join('');
 if(!document.activeElement||!/INPUT|SELECT/.test(document.activeElement.tagName))$('v').innerHTML=({today:vToday,report:vReport,meds:vMeds,set:vSet})[tab]();
 $('clk').textContent=new Date().toLocaleDateString('en-IN',{timeZone:IST,weekday:'long',day:'numeric',month:'long'})}
function popup(){const n=nowM();const L=dueOn(dk()).filter(m=>{const a=tm(m.t);return pf(m.m).notify&&a<=n&&n-a<=360&&!lg(m.id)});
 const o=$('ov');if(!L.length){o.style.display='none';return}o.style.display='block';
 o.innerHTML='<h1>MEDICINE TIME</h1><p>Choose one for each medicine</p>'+L.map(m=>`<div class=c><div class=hd>${av(m.m)}<div><div class=t>${esc(nm(m.m))}</div><div class=s>${esc(m.n)} · ${m.t} ${esc(m.w)}</div></div></div>${btns(m)}</div>`).join('')}
async function sched(extra){const MA=cap('MedAlarm');if(!MA)return;const LN=cap('LocalNotifications');
 try{if(LN){await LN.requestPermissions();const p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications})}}catch(e){}
 const now=Date.now(),im=Date.parse(dk())-19800000,L=[];if(extra&&extra.id)L.push(extra);
 S.meds.forEach(m=>{const p=pf(m.m);if(!m.on||m.off||!p.notify)return;const mi=tm(m.t),ti='MEDICINE TIME',bo=nm(m.m)+': '+m.n+' '+m.w;
  if(!m.every){let at=im+mi*6e4;if(at<=now+1000)at+=864e5;L.push({id:m.id*100,at,title:ti,body:bo,daily:true,strict:p.alarm})}
  else for(let k=0;k<6;k++){const at=Date.parse(m.from)-19800000+k*m.every*864e5+mi*6e4;if(at>now)L.push({id:m.id*100+k+1,at,title:ti,body:bo,daily:false,strict:p.alarm})}});
 try{await MA.schedule({alarms:L})}catch(e){}refreshPS()}
async function refreshPS(){const MA=cap('MedAlarm');if(!MA)return;try{PS=await MA.status();render()}catch(e){}}
setInterval(()=>{if(dk()!==lastDay){lastDay=dk();push();sched()}render();popup()},20000);
document.addEventListener('visibilitychange',()=>{render();popup();refreshPS()});
document.addEventListener('click',()=>{const MA=cap('MedAlarm');if(MA)MA.stop()},true);
initSync();render();popup();sched();
</script></body></html>
